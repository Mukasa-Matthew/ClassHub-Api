spring:
  application:
    name: classhub-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${CLASSHUB_MAX_ATTACHMENT_SIZE}
      max-request-size: ${CLASSHUB_MAX_ATTACHMENT_SIZE}

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: ${CLASSHUB_SESSION_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        name: CLASSHUB_SESSION
        http-only: true
        secure: ${CLASSHUB_COOKIE_SECURE:false}
        same-site: ${CLASSHUB_COOKIE_SAME_SITE:lax}

classhub:
  auth:
    password-reset:
      signing-key: ${CLASSHUB_PASSWORD_RESET_SIGNING_KEY:classhub-local-password-reset-key-change-me}
      otp-ttl: PT10M
      reset-token-ttl: PT10M
      resend-cooldown: PT1M
      maximum-attempts: 5
    class-rep-setup:
      signing-key: ${CLASSHUB_ACCOUNT_SETUP_SIGNING_KEY:classhub-local-development-key-change-me}
      token-ttl: ${CLASSHUB_ACCOUNT_SETUP_TOKEN_TTL:PT24H}
  cors:
    # Comma-separated exact origins. Never use "*". Credentials require explicit allow-list.
    allowed-origins: ${CLASSHUB_CORS_ALLOWED_ORIGINS}
  storage:
    # Local filesystem MVP storage (single-instance). Not under web static roots.
    path: ${CLASSHUB_STORAGE_PATH}
    max-attachment-size: ${CLASSHUB_MAX_ATTACHMENT_SIZE}
    max-course-unit-cover-size: ${CLASSHUB_MAX_COURSE_UNIT_COVER_SIZE:5MB}
  # Future real providers via CLASSHUB_AI_PROVIDER (local|openai|ollama). Only local is wired now.
  # Student BYOK provider keys are intentionally not implemented in this phase — see docs/BYOK-AI.md.
  ai:
    provider: ${CLASSHUB_AI_PROVIDER:local}
  bootstrap:
    admin:
      # Set BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD for first-run SUPER_ADMIN creation.
      # Leave empty after initial setup.
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
  notifications:
    enabled: ${CLASSHUB_NOTIFICATIONS_ENABLED:true}
    timezone: ${CLASSHUB_NOTIFICATION_TIMEZONE:Africa/Kampala}
    web-base-url: ${CLASSHUB_WEB_BASE_URL:http://localhost:5173}
    email:
      enabled: ${CLASSHUB_EMAIL_NOTIFICATIONS_ENABLED:false}
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      api-key: ${BREVO_API_KEY:}
      sender-name: ${BREVO_SENDER_NAME:ClassHub}
      sender-email: ${BREVO_SENDER_EMAIL:}
      reply-to-email: ${BREVO_REPLY_TO_EMAIL:}
      sandbox: ${BREVO_SANDBOX:false}
    whatsapp:
      enabled: ${SOPRASEND_ENABLED:false}
      base-url: ${SOPRASEND_BASE_URL:https://wa.sopraent.com}
      api-key: ${SOPRASEND_API_KEY:}
      device-id: ${SOPRASEND_DEVICE_ID:}
    push:
      enabled: ${CLASSHUB_PUSH_NOTIFICATIONS_ENABLED:false}
      vapid-public-key: ${CLASSHUB_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${CLASSHUB_VAPID_PRIVATE_KEY:}
      subject: ${CLASSHUB_VAPID_SUBJECT:}
    reminders:
      enabled: ${CLASSHUB_DEADLINE_REMINDERS_ENABLED:true}
      deadline-reminder-days: 7,3,1,0
      scheduler-interval: PT1H
    delivery:
      batch-size: 50
      max-attempts: 3
      scheduler-interval: PT1M
      retry-backoff: PT1M,PT5M,PT30M

logging:
  level:
    root: INFO
    com.classhub: INFO
    org.flywaydb: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
