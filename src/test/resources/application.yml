# Test-only defaults. Runtime/local config comes from environment / .env — not from main defaults.
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classhub}
    username: ${DB_USERNAME:classhub}
    password: ${DB_PASSWORD:test}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 5s
  task:
    scheduling:
      enabled: false

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        secure: false

classhub:
  cors:
    allowed-origins: ${CLASSHUB_CORS_ALLOWED_ORIGINS:http://127.0.0.1}
  storage:
    path: target/classhub-test-storage
    max-attachment-size: 1MB
    max-course-unit-cover-size: 5MB
  ai:
    provider: local
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
  notifications:
    enabled: true
    timezone: Africa/Kampala
    web-base-url: http://localhost:5173
    email:
      enabled: false
    whatsapp:
      enabled: false
    reminders:
      enabled: true
      deadline-reminder-days: 7,3,1,0
    delivery:
      batch-size: 50
      max-attempts: 3
