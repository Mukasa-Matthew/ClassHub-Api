services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - classhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CLASSHUB_COOKIE_SECURE: ${CLASSHUB_COOKIE_SECURE:-false}
      CLASSHUB_SESSION_TIMEOUT: ${CLASSHUB_SESSION_TIMEOUT:-8h}
      CLASSHUB_CORS_ALLOWED_ORIGINS: ${CLASSHUB_CORS_ALLOWED_ORIGINS}
      CLASSHUB_STORAGE_PATH: /data/classhub-storage
      CLASSHUB_MAX_ATTACHMENT_SIZE: ${CLASSHUB_MAX_ATTACHMENT_SIZE:-20MB}
      CLASSHUB_AI_PROVIDER: ${CLASSHUB_AI_PROVIDER:-local}
      CLASSHUB_WEB_BASE_URL: ${CLASSHUB_WEB_BASE_URL:-http://localhost:5173}
      CLASSHUB_NOTIFICATION_TIMEZONE: ${CLASSHUB_NOTIFICATION_TIMEZONE:-Africa/Kampala}
      CLASSHUB_NOTIFICATIONS_ENABLED: ${CLASSHUB_NOTIFICATIONS_ENABLED:-true}
      CLASSHUB_EMAIL_NOTIFICATIONS_ENABLED: ${CLASSHUB_EMAIL_NOTIFICATIONS_ENABLED:-false}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-ClassHub}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_REPLY_TO_EMAIL: ${BREVO_REPLY_TO_EMAIL:-}
      BREVO_SANDBOX: ${BREVO_SANDBOX:-false}
      CLASSHUB_WHATSAPP_NOTIFICATIONS_ENABLED: ${CLASSHUB_WHATSAPP_NOTIFICATIONS_ENABLED:-false}
      WHATSAPP_GRAPH_API_BASE_URL: ${WHATSAPP_GRAPH_API_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v24.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-classhub_notification}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      CLASSHUB_DEADLINE_REMINDERS_ENABLED: ${CLASSHUB_DEADLINE_REMINDERS_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes:
      - classhub_storage:/data/classhub-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  classhub_pgdata:
  classhub_storage:
